<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sen ve Ben 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --rose: #e8637a;
  --rose-light: #fce8ec;
  --rose-dark: #c94560;
  --cream: #fdf6f0;
  --warm: #f5e6d8;
  --text: #2d1f1f;
  --text-muted: #8a6a6a;
  --white: #ffffff;
  --shadow: 0 4px 24px rgba(232,99,122,0.12);
  --shadow-lg: 0 12px 48px rgba(232,99,122,0.18);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--text); min-height:100vh; }

#auth-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#fce8ec 0%,#fdf6f0 50%,#f5e6d8 100%); }
.auth-card { background:var(--white); border-radius:24px; padding:48px 40px; box-shadow:var(--shadow-lg); width:100%; max-width:400px; text-align:center; }
.auth-heart { font-size:48px; margin-bottom:16px; animation:heartbeat 1.5s ease-in-out infinite; }
@keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
.auth-title { font-family:'Playfair Display',serif; font-size:32px; color:var(--rose-dark); margin-bottom:8px; }
.auth-sub { color:var(--text-muted); font-size:14px; margin-bottom:32px; }
.auth-tabs { display:flex; background:var(--warm); border-radius:12px; padding:4px; margin-bottom:24px; }
.auth-tab { flex:1; padding:10px; border:none; background:transparent; border-radius:8px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; color:var(--text-muted); transition:all .2s; }
.auth-tab.active { background:var(--white); color:var(--rose-dark); box-shadow:0 2px 8px rgba(0,0,0,0.08); }
.input-group { margin-bottom:16px; text-align:left; }
.input-group label { font-size:12px; font-weight:500; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:6px; }
.input-group input { width:100%; padding:12px 16px; border:1.5px solid #f0dde4; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:15px; background:var(--cream); color:var(--text); outline:none; transition:border-color .2s; }
.input-group input:focus { border-color:var(--rose); }
.btn-primary { width:100%; padding:14px; background:var(--rose); color:white; border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:16px; font-weight:500; cursor:pointer; transition:all .2s; margin-top:8px; }
.btn-primary:hover { background:var(--rose-dark); transform:translateY(-1px); }
.auth-error { color:var(--rose-dark); font-size:13px; margin-top:12px; min-height:20px; }

#app-screen { display:none; min-height:100vh; flex-direction:column; }
.nav { background:var(--white); border-bottom:1px solid #f0dde4; padding:0 20px; display:flex; align-items:center; justify-content:space-between; height:64px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(232,99,122,0.08); }
.nav-logo { font-family:'Playfair Display',serif; font-size:20px; color:var(--rose-dark); }
.nav-tabs { display:flex; gap:4px; }
.nav-tab { padding:8px 14px; border:none; background:transparent; border-radius:10px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; color:var(--text-muted); transition:all .2s; }
.nav-tab.active { background:var(--rose-light); color:var(--rose-dark); }
.btn-logout { padding:8px 14px; border:1.5px solid #f0dde4; border-radius:10px; background:transparent; cursor:pointer; font-size:13px; color:var(--text-muted); font-family:'DM Sans',sans-serif; transition:all .2s; }
.btn-logout:hover { border-color:var(--rose); color:var(--rose); }

.love-counter { background:linear-gradient(135deg,#fce8ec,#f5e6d8); border-bottom:1px solid #f0dde4; padding:10px 20px; text-align:center; }
.love-counter span { font-family:'Playfair Display',serif; color:var(--rose-dark); font-size:15px; }
.love-counter strong { font-size:18px; }

.page { display:none; flex:1; padding:24px 20px; max-width:900px; margin:0 auto; width:100%; }
.page.active { display:block; }
.page-header { margin-bottom:24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.page-title { font-family:'Playfair Display',serif; font-size:28px; color:var(--rose-dark); }

.upload-btn { padding:12px 20px; background:var(--rose); color:white; border:none; border-radius:12px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px; transition:all .2s; }
.upload-btn:hover { background:var(--rose-dark); transform:translateY(-1px); }
.upload-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
#file-input { display:none; }
.upload-progress { background:var(--rose-light); border:1px solid #f0dde4; border-radius:12px; padding:12px 16px; margin-bottom:16px; display:none; align-items:center; gap:10px; font-size:14px; color:var(--rose-dark); }
.upload-progress.show { display:flex; }

.photos-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
.photo-card { background:var(--white); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); transition:all .3s; cursor:pointer; }
.photo-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); }
.photo-img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }
.photo-info { padding:12px 14px; }
.photo-note { font-size:13px; color:var(--text-muted); margin-bottom:4px; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.photo-date { font-size:11px; color:#c4a4a4; }
.photo-uploader { font-size:11px; color:var(--rose); font-weight:500; margin-bottom:4px; }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
.empty-icon { font-size:48px; margin-bottom:12px; }

.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.open { display:flex; }
.modal { background:var(--white); border-radius:20px; max-width:620px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg); position:relative; }
.modal-img { width:100%; max-height:380px; object-fit:contain; background:#f9f0f2; border-radius:20px 20px 0 0; display:block; }
.modal-body { padding:24px; }
.modal-actions { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.btn-modal { padding:9px 16px; border-radius:10px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; transition:all .2s; border:1.5px solid #f0dde4; background:transparent; }
.btn-modal:hover { border-color:var(--rose); background:var(--rose-light); color:var(--rose-dark); }
.btn-modal-danger { color:#c94560; }
.btn-modal-danger:hover { border-color:#c94560; background:#fce8ec; color:#c94560; }
.btn-modal-download { text-decoration:none; display:inline-flex; align-items:center; color:var(--text-muted); }
.modal-label { font-size:12px; font-weight:500; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; display:block; }
.modal-note-area { width:100%; padding:12px; border:1.5px solid #f0dde4; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; resize:none; outline:none; background:var(--cream); color:var(--text); min-height:80px; transition:border-color .2s; }
.modal-note-area:focus { border-color:var(--rose); }
.btn-save-note { padding:10px 20px; background:var(--rose); color:white; border:none; border-radius:10px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; transition:all .2s; margin-top:10px; }
.btn-save-note:hover { background:var(--rose-dark); }
.note-saved { color:#5a9a6a; font-size:13px; margin-top:6px; display:none; }
.modal-close { position:fixed; top:16px; right:16px; background:white; border:none; border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:18px; box-shadow:var(--shadow); z-index:201; }

.messages-container { display:flex; flex-direction:column; height:calc(100vh - 200px); }
.messages-list { flex:1; overflow-y:auto; padding:8px 0; display:flex; flex-direction:column; gap:8px; }
.msg { max-width:72%; display:flex; flex-direction:column; gap:2px; }
.msg.mine { align-self:flex-end; align-items:flex-end; }
.msg.theirs { align-self:flex-start; align-items:flex-start; }
.msg-bubble { padding:11px 15px; border-radius:18px; font-size:15px; line-height:1.5; word-break:break-word; }
.msg.mine .msg-bubble { background:var(--rose); color:white; border-bottom-right-radius:4px; }
.msg.theirs .msg-bubble { background:var(--white); color:var(--text); box-shadow:var(--shadow); border-bottom-left-radius:4px; }
.msg-meta { font-size:11px; color:var(--text-muted); padding:0 4px; }
.msg-sender { font-size:11px; color:var(--rose); font-weight:500; }
.msg-actions { display:none; gap:4px; margin-top:2px; }
.msg:hover .msg-actions { display:flex; }
.msg-action-btn { padding:3px 8px; border:none; background:transparent; cursor:pointer; font-size:11px; color:var(--text-muted); border-radius:6px; font-family:'DM Sans',sans-serif; transition:all .2s; }
.msg-action-btn:hover { background:var(--warm); color:var(--rose-dark); }
.msg-edit-area { width:100%; padding:8px 12px; border:1.5px solid var(--rose); border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; outline:none; background:var(--cream); color:var(--text); resize:none; margin-top:4px; }
.msg-edit-btns { display:flex; gap:6px; margin-top:4px; }
.msg-edit-save { padding:5px 12px; background:var(--rose); color:white; border:none; border-radius:8px; cursor:pointer; font-size:12px; font-family:'DM Sans',sans-serif; }
.msg-edit-cancel { padding:5px 12px; background:transparent; color:var(--text-muted); border:1px solid #f0dde4; border-radius:8px; cursor:pointer; font-size:12px; font-family:'DM Sans',sans-serif; }
.message-input-area { display:flex; gap:10px; padding-top:16px; border-top:1px solid #f0dde4; }
.message-input { flex:1; padding:13px 18px; border:1.5px solid #f0dde4; border-radius:16px; font-family:'DM Sans',sans-serif; font-size:15px; background:var(--white); color:var(--text); outline:none; transition:border-color .2s; }
.message-input:focus { border-color:var(--rose); }
.btn-send { padding:13px 20px; background:var(--rose); color:white; border:none; border-radius:16px; cursor:pointer; font-size:20px; transition:all .2s; }
.btn-send:hover { background:var(--rose-dark); }
.messages-empty { text-align:center; padding:40px; color:var(--text-muted); font-style:italic; }

.loading { display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,.4); border-top-color:white; border-radius:50%; animation:spin .6s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }

@media(max-width:600px) {
  .auth-card { padding:32px 20px; }
  .photos-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
  .msg { max-width:85%; }
  .page { padding:16px; }
  .nav-tab { padding:8px 10px; font-size:13px; }
}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-heart">💕</div>
    <h1 class="auth-title">Sen ve Ben</h1>
    <p class="auth-sub">Sadece ikimizin yeri</p>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Giriş Yap</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Kayıt Ol</button>
    </div>
    <div id="login-form">
      <div class="input-group"><label>E-posta</label><input type="email" id="login-email" placeholder="ornek@mail.com"></div>
      <div class="input-group"><label>Şifre</label><input type="password" id="login-pass" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="doLogin()">Giriş Yap</button>
    </div>
    <div id="register-form" style="display:none">
      <div class="input-group"><label>İsmin</label><input type="text" id="reg-name" placeholder="Adın"></div>
      <div class="input-group"><label>E-posta</label><input type="email" id="reg-email" placeholder="ornek@mail.com"></div>
      <div class="input-group"><label>Şifre</label><input type="password" id="reg-pass" placeholder="En az 6 karakter"></div>
      <button class="btn-primary" onclick="doRegister()">Kayıt Ol</button>
    </div>
    <p class="auth-error" id="auth-error"></p>
  </div>
</div>

<div id="app-screen">
  <nav class="nav">
    <div class="nav-logo">💕 Sen ve Ben</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showPage('photos')" id="tab-photos">📷 Fotoğraflar</button>
      <button class="nav-tab" onclick="showPage('messages')" id="tab-messages">💬 Mesajlar</button>
    </div>
    <button class="btn-logout" onclick="doLogout()">Çıkış</button>
  </nav>

  <div class="love-counter">
    <span>💕 Birlikte <strong id="love-days">0</strong> gün <strong id="love-hours">0</strong> saat <strong id="love-mins">0</strong> dakika <strong id="love-secs">0</strong> saniye 💕</span>
  </div>

  <div class="page active" id="page-photos">
    <div class="page-header">
      <h2 class="page-title">Anılarımız 📸</h2>
      <button class="upload-btn" onclick="document.getElementById('file-input').click()" id="upload-btn">+ Fotoğraf Ekle</button>
      <input type="file" id="file-input" accept="image/*" onchange="uploadPhoto(this)">
    </div>
    <div class="upload-progress" id="upload-progress">
      <div class="loading" style="border-color:rgba(201,69,96,.3);border-top-color:var(--rose-dark)"></div>
      <span>Yükleniyor...</span>
    </div>
    <div class="photos-grid" id="photos-grid">
      <div class="empty-state"><div class="empty-icon">🌸</div><p>Henüz fotoğraf yok!</p></div>
    </div>
  </div>

  <div class="page" id="page-messages">
    <div class="page-header">
      <h2 class="page-title">Mesajlarımız 💬</h2>
    </div>
    <div class="messages-container">
      <div class="messages-list" id="messages-list">
        <div class="messages-empty">Henüz mesaj yok 👋</div>
      </div>
      <div class="message-input-area">
        <input type="text" class="message-input" id="msg-input" placeholder="Bir şeyler yaz..." onkeydown="if(event.key==='Enter')doSendMessage()">
        <button class="btn-send" onclick="doSendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="photo-modal" onclick="handleModalClick(event)">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div class="modal">
    <img class="modal-img" id="modal-img" src="" alt="">
    <div class="modal-body">
      <div style="margin-bottom:12px;">
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:2px;" id="modal-uploader"></div>
        <div style="font-size:12px;color:#c4a4a4;" id="modal-date"></div>
      </div>
      <div class="modal-actions">
        <a class="btn-modal btn-modal-download" id="modal-download-btn" href="#" download target="_blank">⬇ İndir</a>
        <button class="btn-modal btn-modal-danger" onclick="deleteCurrentPhoto()">🗑 Sil</button>
      </div>
      <label class="modal-label">Not / Açıklama</label>
      <textarea class="modal-note-area" id="modal-note" placeholder="Bu fotoğraf hakkında bir not ekle..."></textarea>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn-save-note" onclick="saveNote()">Notu Kaydet</button>
        <span class="note-saved" id="note-saved">✓ Kaydedildi!</span>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDZCgnEsUrIIqJd34MEvIp_a6CVR3kUDSc",
  authDomain: "sen-ve-ben-4b775.firebaseapp.com",
  projectId: "sen-ve-ben-4b775",
  storageBucket: "sen-ve-ben-4b775.firebasestorage.app",
  messagingSenderId: "831950547119",
  appId: "1:831950547119:web:766f993d1a36b10a790c5a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const CLOUD_NAME = "dyzao1ixg";
const UPLOAD_PRESET = "sen_ve_ben";

let currentUser = null;
let currentPhotoId = null;
let currentPhotoUrl = null;
let unsubMessages = null;
let unsubPhotos = null;

// AUTH
window.switchTab = (tab) => {
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('auth-error').textContent = '';
};

window.doLogin = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err = document.getElementById('auth-error');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'E-posta ve şifre gerekli.'; return; }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    err.textContent = 'Giriş başarısız. E-posta veya şifre hatalı.';
  }
};

window.doRegister = async () => {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const err = document.getElementById('auth-error');
  err.textContent = '';
  if (!name || !email || !pass) { err.textContent = 'Tüm alanları doldur.'; return; }
  if (pass.length < 6) { err.textContent = 'Şifre en az 6 karakter olmalı.'; return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
  } catch(e) {
    if (e.code === 'auth/email-already-in-use') err.textContent = 'Bu e-posta zaten kayıtlı.';
    else err.textContent = 'Kayıt başarısız: ' + e.message;
  }
};

window.doLogout = async () => {
  if (unsubMessages) unsubMessages();
  if (unsubPhotos) unsubPhotos();
  await signOut(auth);
};

window.showPage = (page) => {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('tab-' + page).classList.add('active');
};

// PHOTOS
window.uploadPhoto = async (input) => {
  const file = input.files[0];
  if (!file) return;
  const btn = document.getElementById('upload-btn');
  const prog = document.getElementById('upload-progress');
  btn.disabled = true;
  btn.innerHTML = '<div class="loading"></div>';
  prog.classList.add('show');
  try {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    const res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', { method:'POST', body:fd });
    const data = await res.json();
    if (data.secure_url) {
      await addDoc(collection(db, 'photos'), {
        url: data.secure_url,
        note: '',
        uploadedBy: currentUser.displayName || currentUser.email,
        uploadedAt: serverTimestamp()
      });
    } else {
      alert('Yükleme başarısız. Cloudinary preset ayarını kontrol et.');
    }
  } catch(e) {
    alert('Hata: ' + e.message);
  }
  btn.disabled = false;
  btn.innerHTML = '+ Fotoğraf Ekle';
  prog.classList.remove('show');
  input.value = '';
};

function loadPhotos() {
  const q = query(collection(db, 'photos'), orderBy('uploadedAt', 'desc'));
  unsubPhotos = onSnapshot(q, (snap) => {
    const grid = document.getElementById('photos-grid');
    if (snap.empty) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🌸</div><p>Henüz fotoğraf yok!</p></div>';
      return;
    }
    grid.innerHTML = '';
    snap.forEach(ds => {
      const d = ds.data();
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.onclick = () => openModal(ds.id, d);
      const date = d.uploadedAt?.toDate ? d.uploadedAt.toDate().toLocaleDateString('tr-TR') : '';
      card.innerHTML = '<img class="photo-img" src="' + d.url + '" alt="ani" loading="lazy"><div class="photo-info"><div class="photo-uploader">📍 ' + (d.uploadedBy||'') + '</div>' + (d.note ? '<div class="photo-note">💬 ' + d.note + '</div>' : '') + '<div class="photo-date">' + date + '</div></div>';
      grid.appendChild(card);
    });
  });
}

window.openModal = (id, data) => {
  currentPhotoId = id;
  currentPhotoUrl = data.url;
  document.getElementById('modal-img').src = data.url;
  document.getElementById('modal-download-btn').href = data.url;
  document.getElementById('modal-note').value = data.note || '';
  document.getElementById('modal-uploader').textContent = '📍 ' + (data.uploadedBy || '');
  const date = data.uploadedAt?.toDate ? data.uploadedAt.toDate().toLocaleDateString('tr-TR', {year:'numeric',month:'long',day:'numeric'}) : '';
  document.getElementById('modal-date').textContent = date;
  document.getElementById('note-saved').style.display = 'none';
  document.getElementById('photo-modal').classList.add('open');
};

window.handleModalClick = (e) => { if (e.target === document.getElementById('photo-modal')) closeModal(); };
window.closeModal = () => { document.getElementById('photo-modal').classList.remove('open'); currentPhotoId = null; };

window.saveNote = async () => {
  if (!currentPhotoId) return;
  const note = document.getElementById('modal-note').value;
  await updateDoc(doc(db, 'photos', currentPhotoId), { note });
  document.getElementById('note-saved').style.display = 'inline';
  setTimeout(() => document.getElementById('note-saved').style.display = 'none', 2000);
};

window.deleteCurrentPhoto = async () => {
  if (!currentPhotoId) return;
  if (!confirm('Bu fotoğrafı silmek istediğine emin misin?')) return;
  await deleteDoc(doc(db, 'photos', currentPhotoId));
  closeModal();
};

// MESSAGES
function loadMessages() {
  const q = query(collection(db, 'messages'), orderBy('sentAt', 'asc'));
  unsubMessages = onSnapshot(q, (snap) => {
    const list = document.getElementById('messages-list');
    if (snap.empty) {
      list.innerHTML = '<div class="messages-empty">Henüz mesaj yok 👋</div>';
      return;
    }
    list.innerHTML = '';
    snap.forEach(ds => {
      const d = ds.data();
      const isMine = d.uid === currentUser.uid;
      const div = document.createElement('div');
      div.className = 'msg ' + (isMine ? 'mine' : 'theirs');
      const msgDate = d.sentAt?.toDate ? d.sentAt.toDate() : null;
      const now = new Date();
      let time = '';
      if (msgDate) {
        const isToday = msgDate.toDateString() === now.toDateString();
        const isYesterday = new Date(now - 86400000).toDateString() === msgDate.toDateString();
        const timeStr = msgDate.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
        if (isToday) time = 'Bugün ' + timeStr;
        else if (isYesterday) time = 'Dün ' + timeStr;
        else time = msgDate.toLocaleDateString('tr-TR', {day:'numeric',month:'long'}) + ' ' + timeStr;
      }
      div.innerHTML = (!isMine ? '<div class="msg-sender">' + d.senderName + '</div>' : '') +
        '<div class="msg-bubble">' + escHtml(d.text) + '</div>' +
        '<div class="msg-meta">' + time + (d.edited ? ' (düzenlendi)' : '') + '</div>' +
        (isMine ? '<div class="msg-actions"><button class="msg-action-btn" onclick="editMsg(\'' + ds.id + '\',this)">✏️ Düzenle</button><button class="msg-action-btn" onclick="deleteMsg(\'' + ds.id + '\')">🗑 Sil</button></div>' : '');
      list.appendChild(div);
    });
    list.scrollTop = list.scrollHeight;
  });
}

window.doSendMessage = async () => {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await addDoc(collection(db, 'messages'), {
    text,
    uid: currentUser.uid,
    senderName: currentUser.displayName || currentUser.email,
    sentAt: serverTimestamp()
  });
};

window.deleteMsg = async (id) => {
  if (!confirm('Bu mesajı silmek istediğine emin misin?')) return;
  await deleteDoc(doc(db, 'messages', id));
};

window.editMsg = (id, btn) => {
  const msgDiv = btn.closest('.msg');
  const bubble = msgDiv.querySelector('.msg-bubble');
  const actions = msgDiv.querySelector('.msg-actions');
  const currentText = bubble.textContent;
  bubble.style.display = 'none';
  actions.style.display = 'none';
  const ta = document.createElement('textarea');
  ta.className = 'msg-edit-area';
  ta.value = currentText;
  const btns = document.createElement('div');
  btns.className = 'msg-edit-btns';
  btns.innerHTML = '<button class="msg-edit-save">Kaydet</button><button class="msg-edit-cancel">İptal</button>';
  msgDiv.appendChild(ta);
  msgDiv.appendChild(btns);
  btns.querySelector('.msg-edit-save').onclick = async () => {
    const newText = ta.value.trim();
    if (!newText) return;
    await updateDoc(doc(db, 'messages', id), { text: newText, edited: true });
    ta.remove(); btns.remove();
    bubble.style.display = ''; actions.style.display = '';
  };
  btns.querySelector('.msg-edit-cancel').onclick = () => {
    ta.remove(); btns.remove();
    bubble.style.display = ''; actions.style.display = '';
  };
};

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// LOVE COUNTER
function updateCounter() {
  const start = new Date('2023-11-03T00:00:00');
  const now = new Date();
  const diff = now - start;
  document.getElementById('love-days').textContent = Math.floor(diff / 86400000);
  document.getElementById('love-hours').textContent = Math.floor((diff % 86400000) / 3600000);
  document.getElementById('love-mins').textContent = Math.floor((diff % 3600000) / 60000);
  document.getElementById('love-secs').textContent = Math.floor((diff % 60000) / 1000);
}
updateCounter();
setInterval(updateCounter, 1000);

// AUTH STATE
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    loadPhotos();
    loadMessages();
  } else {
    currentUser = null;
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }
});
</script>
