<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sen ve Ben 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #e8637a;
    --rose-light: #fce8ec;
    --rose-dark: #c94560;
    --cream: #fdf6f0;
    --warm: #f5e6d8;
    --text: #2d1f1f;
    --text-muted: #8a6a6a;
    --white: #ffffff;
    --shadow: 0 4px 24px rgba(232,99,122,0.12);
    --shadow-lg: 0 12px 48px rgba(232,99,122,0.18);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--text); min-height:100vh; }

  /* AUTH */
  #auth-screen {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #fce8ec 0%, #fdf6f0 50%, #f5e6d8 100%);
  }
  .auth-card {
    background:var(--white); border-radius:24px; padding:48px 40px;
    box-shadow:var(--shadow-lg); width:100%; max-width:400px; text-align:center;
  }
  .auth-heart { font-size:48px; margin-bottom:16px; animation: heartbeat 1.5s ease-in-out infinite; }
  @keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  .auth-title { font-family:'Playfair Display',serif; font-size:32px; color:var(--rose-dark); margin-bottom:8px; }
  .auth-sub { color:var(--text-muted); font-size:14px; margin-bottom:32px; }
  .auth-tabs { display:flex; background:var(--warm); border-radius:12px; padding:4px; margin-bottom:24px; }
  .auth-tab { flex:1; padding:10px; border:none; background:transparent; border-radius:8px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; color:var(--text-muted); transition:all .2s; }
  .auth-tab.active { background:var(--white); color:var(--rose-dark); box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  .input-group { margin-bottom:16px; text-align:left; }
  .input-group label { font-size:12px; font-weight:500; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:6px; }
  .input-group input { width:100%; padding:12px 16px; border:1.5px solid #f0dde4; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:15px; background:var(--cream); color:var(--text); outline:none; transition:border-color .2s; }
  .input-group input:focus { border-color:var(--rose); }
  .btn-primary { width:100%; padding:14px; background:var(--rose); color:white; border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:16px; font-weight:500; cursor:pointer; transition:all .2s; margin-top:8px; }
  .btn-primary:hover { background:var(--rose-dark); transform:translateY(-1px); box-shadow:var(--shadow); }
  .auth-error { color:var(--rose-dark); font-size:13px; margin-top:8px; min-height:20px; }

  /* APP */
  #app-screen { display:none; min-height:100vh; flex-direction:column; }
  
  /* NAV */
  .nav { background:var(--white); border-bottom:1px solid #f0dde4; padding:0 20px; display:flex; align-items:center; justify-content:space-between; height:64px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(232,99,122,0.08); }
  .nav-logo { font-family:'Playfair Display',serif; font-size:22px; color:var(--rose-dark); display:flex; align-items:center; gap:8px; }
  .nav-tabs { display:flex; gap:4px; }
  .nav-tab { padding:8px 16px; border:none; background:transparent; border-radius:10px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; color:var(--text-muted); transition:all .2s; display:flex; align-items:center; gap:6px; }
  .nav-tab.active { background:var(--rose-light); color:var(--rose-dark); }
  .nav-tab:hover { background:var(--warm); }
  .btn-logout { padding:8px 14px; border:1.5px solid #f0dde4; border-radius:10px; background:transparent; cursor:pointer; font-size:13px; color:var(--text-muted); font-family:'DM Sans',sans-serif; transition:all .2s; }
  .btn-logout:hover { border-color:var(--rose); color:var(--rose); }

  /* PAGES */
  .page { display:none; flex:1; padding:24px 20px; max-width:900px; margin:0 auto; width:100%; }
  .page.active { display:block; }

  /* PHOTOS PAGE */
  .page-header { margin-bottom:24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .page-title { font-family:'Playfair Display',serif; font-size:28px; color:var(--rose-dark); }
  .upload-btn { padding:12px 20px; background:var(--rose); color:white; border:none; border-radius:12px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px; transition:all .2s; }
  .upload-btn:hover { background:var(--rose-dark); transform:translateY(-1px); }
  .upload-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  #file-input { display:none; }
  
  .photos-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; }
  .photo-card { background:var(--white); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); transition:all .3s; cursor:pointer; }
  .photo-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); }
  .photo-img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }
  .photo-info { padding:12px 14px; }
  .photo-note { font-size:13px; color:var(--text-muted); margin-bottom:4px; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .photo-date { font-size:11px; color:#c4a4a4; }
  .photo-uploader { font-size:11px; color:var(--rose); font-weight:500; }
  .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-state .empty-icon { font-size:48px; margin-bottom:12px; }
  .empty-state p { font-size:15px; }

  /* PHOTO MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--white); border-radius:20px; max-width:640px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg); }
  .modal-img { width:100%; max-height:400px; object-fit:contain; background:#f9f0f2; border-radius:20px 20px 0 0; }
  .modal-body { padding:24px; }
  .modal-close { position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.9); border:none; border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; }
  .modal-overlay { position:fixed; }
  .modal-wrap { position:relative; }
  .modal-note-area { width:100%; padding:12px; border:1.5px solid #f0dde4; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; resize:none; outline:none; background:var(--cream); color:var(--text); min-height:80px; transition:border-color .2s; }
  .modal-note-area:focus { border-color:var(--rose); }
  .modal-label { font-size:12px; font-weight:500; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; display:block; }
  .btn-save-note { padding:10px 20px; background:var(--rose); color:white; border:none; border-radius:10px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; transition:all .2s; margin-top:10px; }
  .btn-save-note:hover { background:var(--rose-dark); }
  .note-saved { color:#5a9a6a; font-size:13px; margin-top:6px; display:none; }
  .btn-delete-photo { padding:10px 16px; background:transparent; color:#c94560; border:1.5px solid #f0dde4; border-radius:10px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px; transition:all .2s; margin-left:8px; }
  .btn-delete-photo:hover { border-color:#c94560; background:#fce8ec; }

  /* MESSAGES PAGE */
  .messages-container { display:flex; flex-direction:column; height:calc(100vh - 160px); }
  .messages-list { flex:1; overflow-y:auto; padding:16px 0; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:70%; display:flex; flex-direction:column; gap:4px; }
  .msg.mine { align-self:flex-end; align-items:flex-end; }
  .msg.theirs { align-self:flex-start; align-items:flex-start; }
  .msg-bubble { padding:12px 16px; border-radius:18px; font-size:15px; line-height:1.5; word-break:break-word; }
  .msg.mine .msg-bubble { background:var(--rose); color:white; border-bottom-right-radius:4px; }
  .msg.theirs .msg-bubble { background:var(--white); color:var(--text); box-shadow:var(--shadow); border-bottom-left-radius:4px; }
  .msg-meta { font-size:11px; color:var(--text-muted); padding:0 4px; }
  .msg-sender { font-size:11px; color:var(--rose); font-weight:500; }
  .message-input-area { display:flex; gap:10px; padding-top:16px; border-top:1px solid #f0dde4; }
  .message-input { flex:1; padding:14px 18px; border:1.5px solid #f0dde4; border-radius:16px; font-family:'DM Sans',sans-serif; font-size:15px; background:var(--white); color:var(--text); outline:none; transition:border-color .2s; }
  .message-input:focus { border-color:var(--rose); }
  .btn-send { padding:14px 20px; background:var(--rose); color:white; border:none; border-radius:16px; cursor:pointer; font-size:20px; transition:all .2s; }
  .btn-send:hover { background:var(--rose-dark); transform:scale(1.05); }
  .messages-empty { text-align:center; padding:40px; color:var(--text-muted); font-style:italic; }

  /* LOADING */
  .loading { display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,.4); border-top-color:white; border-radius:50%; animation:spin .6s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* UPLOAD PROGRESS */
  .upload-progress { background:var(--rose-light); border:1px solid #f0dde4; border-radius:12px; padding:12px 16px; margin-bottom:16px; display:none; align-items:center; gap:10px; font-size:14px; color:var(--rose-dark); }
  .upload-progress.show { display:flex; }

  @media(max-width:600px) {
    .auth-card { padding:32px 24px; }
    .nav-tab span { display:none; }
    .photos-grid { grid-template-columns:repeat(2, 1fr); gap:10px; }
    .msg { max-width:85%; }
    .page { padding:16px; }
  }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-heart">💕</div>
    <h1 class="auth-title">Sen ve Ben</h1>
    <p class="auth-sub">Sadece ikimizin yeri</p>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Giriş Yap</button>
      <button class="auth-tab" onclick="switchTab('register')">Kayıt Ol</button>
    </div>
    <div id="login-form">
      <div class="input-group"><label>E-posta</label><input type="email" id="login-email" placeholder="ornek@mail.com"></div>
      <div class="input-group"><label>Şifre</label><input type="password" id="login-pass" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="login()">Giriş Yap</button>
    </div>
    <div id="register-form" style="display:none">
      <div class="input-group"><label>İsmin</label><input type="text" id="reg-name" placeholder="Adın"></div>
      <div class="input-group"><label>E-posta</label><input type="email" id="reg-email" placeholder="ornek@mail.com"></div>
      <div class="input-group"><label>Şifre</label><input type="password" id="reg-pass" placeholder="En az 6 karakter"></div>
      <button class="btn-primary" onclick="register()">Kayıt Ol</button>
    </div>
    <p class="auth-error" id="auth-error"></p>
  </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen">
  <nav class="nav">
    <div class="nav-logo">💕 <span>Sen ve Ben</span></div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showPage('photos')" id="tab-photos">📷 <span>Fotoğraflar</span></button>
      <button class="nav-tab" onclick="showPage('messages')" id="tab-messages">💬 <span>Mesajlar</span></button>
    </div>
    <button class="btn-logout" onclick="logout()">Çıkış</button>
  </nav>

  <!-- PHOTOS PAGE -->
  <div class="page active" id="page-photos">
    <div class="page-header">
      <h2 class="page-title">Anılarımız 📸</h2>
      <button class="upload-btn" onclick="document.getElementById('file-input').click()" id="upload-btn">
        <span>+ Fotoğraf Ekle</span>
      </button>
      <input type="file" id="file-input" accept="image/*" onchange="uploadPhoto(this)">
    </div>
    <div class="upload-progress" id="upload-progress">
      <div class="loading" style="border-color:rgba(201,69,96,.3);border-top-color:var(--rose-dark)"></div>
      <span>Fotoğraf yükleniyor...</span>
    </div>
    <div class="photos-grid" id="photos-grid">
      <div class="empty-state">
        <div class="empty-icon">🌸</div>
        <p>Henüz fotoğraf yok.<br>İlk anını ekle!</p>
      </div>
    </div>
  </div>

  <!-- MESSAGES PAGE -->
  <div class="page" id="page-messages">
    <div class="page-header">
      <h2 class="page-title">Mesajlarımız 💬</h2>
    </div>
    <div class="messages-container">
      <div class="messages-list" id="messages-list">
        <div class="messages-empty">Henüz mesaj yok. Merhaba de! 👋</div>
      </div>
      <div class="message-input-area">
        <input type="text" class="message-input" id="msg-input" placeholder="Bir şeyler yaz..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="btn-send" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- PHOTO MODAL -->
<div class="modal-overlay" id="photo-modal" onclick="closeModal(event)">
  <div class="modal-wrap">
    <div class="modal">
      <img class="modal-img" id="modal-img" src="" alt="">
      <div class="modal-body">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <div>
            <div style="font-size:13px;color:var(--text-muted)" id="modal-uploader"></div>
            <div style="font-size:12px;color:#c4a4a4" id="modal-date"></div>
          </div>
          <button class="btn-delete-photo" onclick="deleteCurrentPhoto()">🗑 Sil</button>
        </div>
        <label class="modal-label">Not / Açıklama</label>
        <textarea class="modal-note-area" id="modal-note" placeholder="Bu fotoğraf hakkında bir not ekle..."></textarea>
        <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
          <button class="btn-save-note" onclick="saveNote()">Notu Kaydet</button>
          <span class="note-saved" id="note-saved">✓ Kaydedildi!</span>
        </div>
      </div>
    </div>
    <button class="modal-close" onclick="closeModalBtn()" style="position:fixed;top:20px;right:20px;">✕</button>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDZCgnEsUrIIqJd34MEvIp_a6CVR3kUDSc",
    authDomain: "sen-ve-ben-4b775.firebaseapp.com",
    projectId: "sen-ve-ben-4b775",
    storageBucket: "sen-ve-ben-4b775.firebasestorage.app",
    messagingSenderId: "831950547119",
    appId: "1:831950547119:web:766f993d1a36b10a790c5a"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const CLOUD_NAME = "dyzao1ixg";
  const UPLOAD_PRESET = "sen_ve_ben";

  let currentUser = null;
  let currentPhotoId = null;
  let unsubMessages = null;
  let unsubPhotos = null;

  window.switchTab = (tab) => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
    event.target.classList.add('active');
    document.getElementById('auth-error').textContent = '';
  };

  window.login = async () => {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    if (!email || !pass) { errEl.textContent = 'E-posta ve şifre gerekli.'; return; }
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      errEl.textContent = 'Giriş başarısız. E-posta veya şifre hatalı.';
    }
  };

  window.register = async () => {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-pass').value;
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    if (!name || !email || !pass) { errEl.textContent = 'Tüm alanları doldur.'; return; }
    if (pass.length < 6) { errEl.textContent = 'Şifre en az 6 karakter olmalı.'; return; }
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
    } catch(e) {
      if (e.code === 'auth/email-already-in-use') errEl.textContent = 'Bu e-posta zaten kayıtlı.';
      else errEl.textContent = 'Kayıt başarısız. Tekrar dene.';
    }
  };

  window.logout = async () => {
    if (unsubMessages) unsubMessages();
    if (unsubPhotos) unsubPhotos();
    await signOut(auth);
  };

  window.showPage = (page) => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('tab-' + page).classList.add('active');
  };

  // UPLOAD PHOTO
  window.uploadPhoto = async (input) => {
    const file = input.files[0];
    if (!file) return;
    const btn = document.getElementById('upload-btn');
    const progress = document.getElementById('upload-progress');
    btn.disabled = true;
    btn.innerHTML = '<div class="loading"></div>';
    progress.classList.add('show');
    try {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method:'POST', body:formData });
      const data = await res.json();
      if (data.secure_url) {
        await addDoc(collection(db, 'photos'), {
          url: data.secure_url,
          publicId: data.public_id,
          note: '',
          uploadedBy: currentUser.displayName || currentUser.email,
          uploadedAt: serverTimestamp()
        });
      } else {
        alert('Yükleme başarısız. Cloudinary upload preset ayarını kontrol et.');
      }
    } catch(e) {
      alert('Bir hata oluştu: ' + e.message);
    }
    btn.disabled = false;
    btn.innerHTML = '<span>+ Fotoğraf Ekle</span>';
    progress.classList.remove('show');
    input.value = '';
  };

  // LOAD PHOTOS
  function loadPhotos() {
    const q = query(collection(db, 'photos'), orderBy('uploadedAt', 'desc'));
    unsubPhotos = onSnapshot(q, (snap) => {
      const grid = document.getElementById('photos-grid');
      if (snap.empty) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🌸</div><p>Henüz fotoğraf yok.<br>İlk anını ekle!</p></div>';
        return;
      }
      grid.innerHTML = '';
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.onclick = () => openModal(docSnap.id, d);
        const date = d.uploadedAt?.toDate ? d.uploadedAt.toDate().toLocaleDateString('tr-TR') : '';
        card.innerHTML = `
          <img class="photo-img" src="${d.url}" alt="anı" loading="lazy">
          <div class="photo-info">
            <div class="photo-uploader">📍 ${d.uploadedBy || ''}</div>
            ${d.note ? `<div class="photo-note">💬 ${d.note}</div>` : ''}
            <div class="photo-date">${date}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    });
  }

  // MODAL
  window.openModal = (id, data) => {
    currentPhotoId = id;
    document.getElementById('modal-img').src = data.url;
    document.getElementById('modal-note').value = data.note || '';
    document.getElementById('modal-uploader').textContent = '📍 ' + (data.uploadedBy || '');
    const date = data.uploadedAt?.toDate ? data.uploadedAt.toDate().toLocaleDateString('tr-TR', {year:'numeric',month:'long',day:'numeric'}) : '';
    document.getElementById('modal-date').textContent = date;
    document.getElementById('note-saved').style.display = 'none';
    document.getElementById('photo-modal').classList.add('open');
  };

  window.closeModal = (e) => { if (e.target === document.getElementById('photo-modal')) closeModalBtn(); };
  window.closeModalBtn = () => { document.getElementById('photo-modal').classList.remove('open'); currentPhotoId = null; };

  window.saveNote = async () => {
    if (!currentPhotoId) return;
    const note = document.getElementById('modal-note').value;
    await updateDoc(doc(db, 'photos', currentPhotoId), { note });
    document.getElementById('note-saved').style.display = 'inline';
    setTimeout(() => document.getElementById('note-saved').style.display = 'none', 2000);
  };

  window.deleteCurrentPhoto = async () => {
    if (!currentPhotoId) return;
    if (!confirm('Bu fotoğrafı silmek istediğine emin misin?')) return;
    await deleteDoc(doc(db, 'photos', currentPhotoId));
    closeModalBtn();
  };

  // MESSAGES
  function loadMessages() {
    const q = query(collection(db, 'messages'), orderBy('sentAt', 'asc'));
    unsubMessages = onSnapshot(q, (snap) => {
      const list = document.getElementById('messages-list');
      if (snap.empty) {
        list.innerHTML = '<div class="messages-empty">Henüz mesaj yok. Merhaba de! 👋</div>';
        return;
      }
      list.innerHTML = '';
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const isMine = d.uid === currentUser.uid;
        const div = document.createElement('div');
        div.className = 'msg ' + (isMine ? 'mine' : 'theirs');
        const time = d.sentAt?.toDate ? d.sentAt.toDate().toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'}) : '';
        div.innerHTML = `
          ${!isMine ? `<div class="msg-sender">${d.senderName}</div>` : ''}
          <div class="msg-bubble">${escapeHtml(d.text)}</div>
          <div class="msg-meta">${time}</div>
        `;
        list.appendChild(div);
      });
      list.scrollTop = list.scrollHeight;
    });
  }

  window.sendMessage = async () => {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    await addDoc(collection(db, 'messages'), {
      text,
      uid: currentUser.uid,
      senderName: currentUser.displayName || currentUser.email,
      sentAt: serverTimestamp()
    });
  };

  function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // AUTH STATE
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'flex';
      loadPhotos();
      loadMessages();
    } else {
      currentUser = null;
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-screen').style.display = 'none';
    }
  });
</script>
</body>
</html>
